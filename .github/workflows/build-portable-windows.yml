name: Build latest UxPlay Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-portable-windows.yml'
      - 'packaging/**'
      - 'README-PORTABLE-KO.md'

permissions:
  contents: read

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout fork packaging files
        uses: actions/checkout@v4

      # Always build the latest ORIGINAL upstream source, even if the fork is older.
      - name: Checkout latest original FDH2/UxPlay
        uses: actions/checkout@v4
        with:
          repository: FDH2/UxPlay
          ref: master
          path: upstream
          persist-credentials: false

      - name: Install MSYS2 UCRT64 build and multimedia runtime
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-json-glib

      - name: Build unchanged upstream UxPlay with built-in mDNS
        run: |
          set -eux
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_DNS_SD=OFF
          cmake --build build --parallel 2
          test -f build/uxplay.exe

      - name: Build self-contained launcher (no BAT or manual commands)
        run: |
          set -eux
          gcc -O2 -Wall -Wextra -municode -o build/portable-launcher.exe packaging/launcher.c -lws2_32
          test -f build/portable-launcher.exe

      - name: Setup Python for portable packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows BLE beacon freezer and WinRT libraries
        shell: pwsh
        run: |
          python -m pip install pefile!=2024.8.26 pyinstaller==6.16.0 psutil "winrt-Windows.Foundation" "winrt-Windows.Foundation.Collections" "winrt-Windows.Devices.Bluetooth.Advertisement" "winrt-Windows.Storage.Streams"

      - name: Freeze original BLE beacon as an independent Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name UxPlayBLEBeacon --distpath build/ble-dist --workpath build/ble-work --specpath build/ble-work --paths upstream/Bluetooth_LE_beacon --hidden-import uxplay_beacon_module_winrt --hidden-import winrt.windows.foundation.collections --hidden-import winrt.windows.devices.bluetooth.advertisement --hidden-import winrt.windows.storage.streams --collect-submodules winrt upstream/Bluetooth_LE_beacon/uxplay-beacon.py
          if (!(Test-Path build/ble-dist/UxPlayBLEBeacon/UxPlayBLEBeacon.exe)) { throw "BLE beacon binary missing" }

      - name: Test bundled Windows BLE module without a physical adapter
        shell: pwsh
        run: |
          $env:PYTHONUNBUFFERED = '1'
          $script = @'
          import os,sys,subprocess,time
          exe=os.path.abspath("build/ble-dist/UxPlayBLEBeacon/UxPlayBLEBeacon.exe")
          missing=os.path.abspath("build/no-beacon-file.bin")
          result=subprocess.run([exe,"--help"],capture_output=True,text=True,timeout=30)
          print("HELP RETURN:",result.returncode)
          print("HELP STDOUT:",repr(result.stdout[:300]))
          print("HELP STDERR:",repr(result.stderr[:300]))
          if result.returncode:
              sys.exit(1)
          p=subprocess.Popen([exe,"--path",missing,"--ipv4","192.0.2.10"],
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          time.sleep(6)
          print("BEACON RETURN AFTER 6S:",p.poll())
          if p.poll() is None:
              p.kill()
          out,err=p.communicate(timeout=20)
          print("BEACON STDOUT:",repr(out.decode("utf-8",errors="replace")[:5000]))
          print("BEACON STDERR:",repr(err.decode("utf-8",errors="replace")[:5000]))
          if b"loaded uxplay_beacon_module_winrt" not in out:
              print("WARNING: WinRT BLE initialization cannot be verified on this Windows Server CI runner.")
              print("The frozen executable passed --help; BLE advertising requires desktop Windows and a supported Bluetooth adapter.")
          else:
              print("WinRT BLE helper loaded successfully (advertising still requires hardware).")
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw "Frozen BLE smoke test failed: $LASTEXITCODE" }

      - name: Package original binary, GStreamer and dependency DLLs
        shell: pwsh
        run: |
          $prefix = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64"
          python packaging/package_portable.py --original build/uxplay.exe --launcher build/portable-launcher.exe --source upstream --prefix "$prefix" --output dist/UxPlay-Portable --beacon-dir build/ble-dist/UxPlayBLEBeacon

      - name: Smoke test native EXE through launcher
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/UxPlay-Portable/UxPlay.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '-h' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "UxPlay help test exited with code $($proc.ExitCode)" }

      - name: Verify GStreamer decoding, video, audio plugins
        shell: pwsh
        run: |
          $runtime = (Resolve-Path dist/UxPlay-Portable/runtime).Path
          $env:PATH = "$runtime;$env:PATH"
          $env:GST_PLUGIN_PATH_1_0 = "$runtime\plugins"
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$runtime\plugins"
          $env:GST_PLUGIN_SCANNER = "$runtime\gst-plugin-scanner.exe"
          $env:GST_PLUGIN_SCANNER_1_0 = "$runtime\gst-plugin-scanner.exe"
          foreach ($element in @('avdec_h264', 'autovideosink', 'autoaudiosink')) {
            & "$runtime\gst-inspect-1.0.exe" $element | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "GStreamer plugin unavailable: $element" }
          }

      - name: Check default listener stays alive (Windows smoke test)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/UxPlay-Portable/UxPlay.exe).Path
          $out = Join-Path $PWD 'dist/smoke-out.txt'
          $err = Join-Path $PWD 'dist/smoke-err.txt'
          # A name option avoids the interactive double-click error hold.
          $proc = Start-Process -FilePath $exe -ArgumentList @('-n', 'UxPlay-CI-Smoke') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            Start-Sleep -Seconds 8
            $proc.Refresh()
            if ($proc.HasExited) {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "UxPlay unexpectedly exited during startup, code: $($proc.ExitCode)"
            }
            Write-Host 'UxPlay is still running after startup.'
          } finally {
            & taskkill /T /F /PID $proc.Id 2>&1 | Out-Null
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-Portable-x64
          path: dist/UxPlay-Portable.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
